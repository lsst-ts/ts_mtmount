{% set data= load_setup_py_data() %}
package:
  name: ts-mtmount
  version: {{ data.get('version') }}

source:
  path: ../

build:
  noarch: python
  script: {{ PYTHON }} -m pip install --no-deps --ignore-installed .
  string: "py{{ PY_VER | replace('.', '') }}{{ PKG_HASH }}_{{ PKG_BUILDNUM }}"

test:
  requires:
    - ts-conda-build =0.5
    - ts-xml {{ xml_version }}
    - ts-salobj {{ salobj_version }}
    - ts-simactuators
    - ts-tcpip
  source_files:
    - bin
    - python
    - tests
  commands:
    - pytest

requirements:
  host:
    - pip
    - python {{ python }}
    - setuptools {{ setuptools }}
    - setuptools_scm {{ setuptools_scm }}
  run:
    - python {{ python }}
    - setuptools {{ setuptools }}
    - setuptools_scm {{ setuptools_scm }}
    - ts-xml {{ xml_version }}
    - ts-salobj {{ salobj_version }}
    - ts-simactuators
    - ts-tcpip
